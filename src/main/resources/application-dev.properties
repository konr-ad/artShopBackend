spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?ród?a danych z ENV (z dev.env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# CORS: frontend lokalny
app.frontend.origin=${FRONTEND_IP_ADDRESS}

# PayU z ENV (dev.env) ? sandbox/credentials
payu.client-id=${PAYU_CLIENT_ID}
payu.client-secret=${PAYU_CLIENT_SECRET}
payu.auth-url=${PAYU_AUTH_URL}
payu.order-url=${PAYU_ORDER_URL}
payu.continue-url=${PAYU_CONTINUE_URL:http://localhost:4200/thankyou}
payu.notify-url=${PAYU_NOTIFY_URL:http://localhost:8080/api/payments/payu/notify}

# Logi
logging.level.org.springframework=DEBUG
logging.level.com.artshop=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
